[project]
name = "pyoci"
version = "0.1.0"
description = "Experimental OCI image builder for Python projects (pure Python, Docker-less, Dockerfile-less)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "PyOCI contributors" }
]
license = "MIT"
dependencies = []

[project.scripts]
pyoci = "pyoci.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
