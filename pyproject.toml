[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pyoci = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
